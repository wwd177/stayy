[project]
name = "stayy"
version = "0.1.0"
description = "Stayy — Hardened Local-First AI Coding & Precision PC Remote Control Hub (Windows-first)"
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1.0.1",
    "segno>=1.6.1",
    "websockets>=14.0",
]

[project.scripts]
stayy = "stayy.main:main"
stayy-setup = "stayy.setup_wizard:main"

[project.gui-scripts]
stayy-launcher = "stayy.launcher:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stayy"]
